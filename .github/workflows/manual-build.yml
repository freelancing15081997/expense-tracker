name: Manual Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android App Manually
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npm run mobile:sync:android

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ google-services.json created"
          else
            echo "⚠️ GOOGLE_SERVICES_JSON secret not found - using existing file"
          fi

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "✅ local.properties created"

      - name: Create gradle.properties
        run: |
          cat > android/gradle.properties << EOF
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF
          echo "✅ gradle.properties created with AndroidX enabled"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "✅ Debug APK built successfully"

      - name: Build Release APK
        if: inputs.build_type == 'release'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "✅ Release APK built successfully"

      - name: Upload Debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-manual
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-manual
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Get APK Info
        run: |
          if [ "${{ inputs.build_type }}" == "debug" ]; then
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ APK created successfully"
            echo "📦 Size: $APK_SIZE"
            echo "📍 Location: $APK_PATH"
          else
            echo "❌ APK not found"
          fi

      - name: Summary
        run: |
          echo "# 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: com.byjanbooks.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Download" >> $GITHUB_STEP_SUMMARY
          echo "Scroll down to **Artifacts** section below to download your APK!" >> $GITHUB_STEP_SUMMARY
