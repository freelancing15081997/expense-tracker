name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      draft:
        description: Upload as a draft (recommended until listing is complete)
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  play:
    name: Signed AAB → Play Console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Require signing secrets
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          [ -z "$KEYSTORE_FILE" ] && echo "Missing secret KEYSTORE_FILE" && missing=1
          [ -z "$KEYSTORE_PASSWORD" ] && echo "Missing secret KEYSTORE_PASSWORD" && missing=1
          [ -z "$KEY_ALIAS" ] && echo "Missing secret KEY_ALIAS" && missing=1
          [ -z "$KEY_PASSWORD" ] && echo "Missing secret KEY_PASSWORD" && missing=1
          if [ "$missing" = "1" ]; then
            echo "Add the four signing secrets, then re-run this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            echo "Need GOOGLE_SERVICES_JSON secret or a committed google-services.json"
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo "$KEYSTORE_FILE" | base64 -d > android/app/byjan-upload.jks
          test -s android/app/byjan-upload.jks

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Create gradle.properties
        run: |
          cat > android/gradle.properties << EOF
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build signed release bundle
        env:
          BYJAN_RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/byjan-upload.jks
          BYJAN_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BYJAN_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BYJAN_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: byjan-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Check Play API credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Play upload. Add secret PLAY_SERVICE_ACCOUNT_JSON after the app listing exists."
          fi

      - name: Publish to Play Console
        if: steps.play.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.byjanbooks.com
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.draft == 'false' && 'completed' || 'draft' }}
          releaseName: ${{ github.ref_name }}
          changesNotSentForReview: true
