# Cloudflare Pages configuration for Byjan Business frontend

name = "byjan-business-frontend"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

# Build configuration
build = {
    command = "npm run build",
    cwd = "apps/frontend",
}

# Environment variables (Vite inlines VITE_* at build time — set secrets in CF Pages too)
[vars]
VITE_API_URL = "https://api.easypado.com"
VITE_APP_URL = "https://business.easypado.com"
VITE_ENV = "production"
VITE_AUTH_MODE = "live"
VITE_DEMO_SEED = "0"
VITE_IDLE_MINUTES = "30"
# Set these as Cloudflare Pages encrypted build vars (not committed):
# VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
# VITE_FIREBASE_APP_ID, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_STORAGE_BUCKET

# Custom domain
[vars.custom_domains]
business = "business.easypado.com"
app = "app.easypado.com"

# Routes
routes = [
    { pattern = "business.easypado.com", zone_name = "easypado.com" },
    { pattern = "app.easypado.com", zone_name = "easypado.com" },
]

# Headers
headers = {
    "/*" = {
        "X-Frame-Options" = "DENY",
        "X-Content-Type-Options" = "nosniff",
        "X-XSS-Protection" = "1; mode=block",
        "Referrer-Policy" = "strict-origin-when-cross-origin",
        "Permissions-Policy" = "camera=(), microphone=(), geolocation=()",
    },
}

# Redirects
redirects = [
    { from = "/old-path/*", to = "/new-path/:splat", status = 301 },
]
