# Free-tier blueprint. Do not add Render Postgres, Render Redis, or a
# separate worker here: those are paid. The database is the existing Neon
# project (schemas core, biz, ca, console). Redis is Redis Cloud's free 30 MB
# database. The web process also starts the Arq worker. Scale later by moving
# this service from Free to a paid instance and splitting the worker out.
services:
  - type: web
    name: byjan-business-api
    runtime: docker
    plan: free
    branch: byjan_business
    rootDir: byjan-platform/apps/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Byjan Business
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: JWT_PRIVATE_KEYS
        sync: false
      - key: JWT_PUBLIC_KEYS
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: ALLOWED_ORIGINS
        value: '["http://localhost:5173","http://localhost:5174","https://business.easypado.com","https://app.easypado.com","https://byjan-business-frontend.pages.dev"]'
