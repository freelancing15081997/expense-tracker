services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: byjan
      POSTGRES_PASSWORD: byjan
      POSTGRES_DB: byjan
    ports:
      - "5432:5432"
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server:/app
    command: sh -c "npm install && npx prisma db push && npm run seed && npm run dev"
    environment:
      DATABASE_URL: postgres://byjan:byjan@db:5432/byjan
      PORT: "4000"
      PAYMENT_SANDBOX: "1"
      JWT_SECRET: byjan-dev-secret
      WEBHOOK_SECRET: byjan-dev-webhook
    ports:
      - "4000:4000"
    depends_on:
      - db
