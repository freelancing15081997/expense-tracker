<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Byjan — Trace Financials Easily</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="description" content="Byjan — Trace Financials Easily. Books and expense tracking in one workspace." />
    <meta property="og:title" content="Byjan — Trace Financials Easily" />
    <meta property="og:description" content="Byjan — Trace Financials Easily. Books and expense tracking in one workspace." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; min-height: 100%; background: #0B1F3A; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(90% 70% at 50% 0%, rgba(18,184,168,0.28), transparent 55%),
          linear-gradient(165deg, #143052 0%, #0B1F3A 48%, #071526 100%);
        color: #fff; font-family: Fraunces, Figtree, system-ui, sans-serif;
        transition: opacity .28s ease, visibility .28s ease;
      }
      #boot-splash.is-gone { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot-splash img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 18px 40px -18px rgba(0,0,0,.55); }
      #boot-splash strong { margin-top: 14px; font-size: 22px; letter-spacing: -0.03em; font-weight: 650; }
      #boot-splash span { margin-top: 6px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,.55); font-weight: 600; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-zinc-600 selection:text-white">
    <div id="boot-splash" aria-hidden="true">
      <img src="/logo.png" alt="" width="72" height="72" />
      <strong>Byjan</strong>
      <span>Trace financials easily</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.__byjanHideBoot = function () {
        var el = document.getElementById('boot-splash');
        if (el) el.classList.add('is-gone');
      };
    </script>
  </body>
</html>
